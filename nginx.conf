server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options DENY always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options DENY always;
  }

  location / {
    try_files $uri /index.html;
  }
}
